[package]
name = "mod-chunky"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
# The version in the Horizon Cargo.lock the bundle targets (region files are zlib or gzip).
flate2 = "1.1"

[features]
# Needs engine branch rec-world-data (`LevelRef::delete_chunks`): a confirmed trim runs while the server is up.
next-engine = []

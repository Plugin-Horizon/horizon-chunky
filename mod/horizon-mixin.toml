[mod]
id = "chunky"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "69fab597a6f0e8a6ce524d38d1b73e599e343034"

[[crate]]
id = "core"
path = "core"
dependent = "horizon-client"

# The game side of the permission nodes (`chunky.command.<sub>`): a support module in `game.rs`, so it reaches the
# game's `native_has_permission`, which the hooks' helpers cannot call.
[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "chunky_glue"
source = "glue.rs"

[[injection]]
id = "register"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_register_commands"
helper = "register.rs"
bindings = [{ name = "commands", ty = "&mut Vec<crate::game::native_server::NativeCommand>", value = "commands" }]

[[injection]]
id = "console"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_perform_console_command"
helper = "console.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "ran" },
]

[[injection]]
id = "perform"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_perform_command"
helper = "perform.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&crate::game::native_server::NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "ran" },
]

[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_level_tick_pre"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
]

[[injection]]
id = "tick-post"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_level_tick_post"
helper = "tick_post.rs"
bindings = [{ name = "dimension", ty = "&str", value = "dimension" }]

[[injection]]
id = "chunk-load"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_chunk_load"
helper = "chunk_load.rs"
bindings = [
  { name = "dimension", ty = "&str", value = "dimension" },
  { name = "chunk", ty = "[i32; 2]", value = "chunk" },
]

[[injection]]
id = "level-load"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_level_load"
helper = "level_load.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
]

[[injection]]
id = "stopping"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_server_stopping"
helper = "stopping.rs"
bindings = []

[[injection]]
id = "about-to-start"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_server_about_to_start"
helper = "about_to_start.rs"
bindings = []

[[injection]]
id = "chunk-unload"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_chunk_unload"
helper = "chunk_unload.rs"
bindings = [
  { name = "dimension", ty = "&str", value = "dimension" },
  { name = "chunk", ty = "[i32; 2]", value = "chunk" },
]
